name: Alwakile site quality and social card
on:
  push:
    branches:
      - main
      - feat/production-landing-social-preview
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Build social card
        run: python scripts/render_og.py
      - name: Validate production files
        run: python scripts/verify_site.py
      - name: Commit generated PNG when changed
        run: |
          if ! git diff --quiet -- og-card.png || [ ! -f og-card.png ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add og-card.png
            if ! git diff --cached --quiet; then
              git commit -m "build: update Alwakile social preview PNG"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
