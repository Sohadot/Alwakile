name: Alwakile site quality and social card
on:
  push:
    branches:
      - main
      - fix/pages-docs-publish-source
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Build social card
        run: python scripts/render_og.py
      - name: Validate production files
        run: python scripts/verify_site.py
      - name: Commit generated PNG when changed
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git ls-files -- docs/og-card.png)" ] || ! git diff --quiet -- docs/og-card.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/og-card.png
            if ! git diff --cached --quiet; then
              git commit -m "build: update Alwakile social preview PNG"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
